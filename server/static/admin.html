<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>溯源管理后台</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --panel: #fff;
      --ink: #1d1914;
      --muted: #8b8176;
      --line: #e6dfd5;
      --accent: #8b5e34;
      --accent-soft: #f0e5d7;
      --ok: #2f5d50;
      --danger: #a33b32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { width: min(960px, 100%); margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: 0.04em; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input, textarea, button, select {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px 12px;
    }
    input, textarea { width: 100%; background: #fffdf9; }
    textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
    }
    button.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .pill.off { background: #f3e4e2; color: var(--danger); }
    .msg { margin: 10px 0 0; font-size: 13px; color: var(--ok); white-space: pre-wrap; }
    .msg.err { color: var(--danger); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
    .stat {
      background: var(--accent-soft);
      border-radius: 14px;
      padding: 14px;
    }
    .stat .n { font-size: 24px; font-weight: 600; }
    .stat .l { color: var(--muted); font-size: 12px; }
    .hidden { display: none; }
    a { color: var(--accent); }
    code { background: #f4eee6; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>服装溯源 · 管理后台</h1>
    <p class="sub">轻量导入 / 生码 / 启停用 · 演示账号 <code>admin / yalan2026</code></p>

    <section class="panel" id="loginPanel">
      <div class="row">
        <input id="username" placeholder="账号" value="admin" style="max-width:220px" />
        <input id="password" type="password" placeholder="密码" value="yalan2026" style="max-width:220px" />
        <button id="loginBtn">登录</button>
      </div>
      <div class="msg" id="loginMsg"></div>
    </section>

    <section class="panel hidden" id="mainPanel">
      <div class="grid" id="stats"></div>
      <div class="row" style="margin-bottom:12px">
        <a href="/" target="_blank">打开溯源页首页</a>
        <a href="/demo" target="_blank">演示二维码页</a>
        <button class="ghost" id="refreshBtn">刷新数据</button>
        <button class="ghost" id="logoutBtn">退出</button>
      </div>

      <div class="panel" style="margin:0 0 14px">
        <h3 style="margin:0 0 10px;font-size:15px">批量导入（JSON 行）</h3>
        <p class="sub" style="margin:0 0 8px">字段：style_no, name, composition, standard_no, batch_no, production_date, inspector</p>
        <textarea id="importBox">[
  {"style_no":"YL-D-2641","name":"羊绒围巾","composition":"100% 山羊绒","standard_no":"GB/T 14255-2017","batch_no":"20261001-D","production_date":"2026-10-01","inspector":"周颖"}
]</textarea>
        <div class="row" style="margin-top:10px">
          <button id="importBtn">导入并生码</button>
        </div>
        <div class="msg" id="importMsg"></div>
      </div>

      <div class="panel" style="margin:0">
        <h3 style="margin:0 0 10px;font-size:15px">溯源码列表</h3>
        <div id="tableWrap">加载中…</div>
      </div>
    </section>
  </div>

  <script>
    const state = { token: localStorage.getItem("gt_token") || "" };

    function $(id) { return document.getElementById(id); }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json" };
      if (state.token) headers["Authorization"] = state.token;
      // FastAPI demo uses simple token query fallback via header name token
      if (state.token) headers["token"] = state.token;
      const res = await fetch(path, { ...options, headers });
      return res.json();
    }

    async function afterLogin() {
      $("loginPanel").classList.add("hidden");
      $("mainPanel").classList.remove("hidden");
      await refresh();
    }

    async function refresh() {
      const sum = await api("/api/admin/summary");
      const codes = await api("/api/admin/codes");
      if (sum.code !== 0) {
        $("tableWrap").innerHTML = "请重新登录";
        return;
      }
      const s = sum.data;
      $("stats").innerHTML = `
        <div class="stat"><div class="n">${s.products}</div><div class="l">款号</div></div>
        <div class="stat"><div class="n">${s.batches}</div><div class="l">批次</div></div>
        <div class="stat"><div class="n">${s.codes}</div><div class="l">溯源码</div></div>
        <div class="stat"><div class="n">${s.active_codes}</div><div class="l">启用中</div></div>
      `;
      const rows = codes.data || [];
      $("tableWrap").innerHTML = `
        <table>
          <thead>
            <tr><th>溯源码</th><th>款号</th><th>品名</th><th>批次</th><th>厂家</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><a href="/t/${r.code}" target="_blank">${r.code}</a></td>
                <td>${r.style_no}</td>
                <td>${r.product_name}</td>
                <td>${r.batch_no}</td>
                <td>${r.factory_name}</td>
                <td><span class="pill ${r.status === "active" ? "" : "off"}">${r.status === "active" ? "启用" : "停用"}</span></td>
                <td><button class="ghost" onclick="toggle(${r.id}, '${r.status === "active" ? "disabled" : "active"}')">${r.status === "active" ? "停用" : "启用"}</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    window.toggle = async function (id, status) {
      await api(`/api/admin/codes/${id}`, { method: "PATCH", body: JSON.stringify({ status }) });
      await refresh();
    };

    $("loginBtn").onclick = async () => {
      const json = await api("/api/admin/login", {
        method: "POST",
        body: JSON.stringify({
          username: $("username").value.trim(),
          password: $("password").value,
        }),
      });
      if (json.code !== 0) {
        $("loginMsg").textContent = json.message || "登录失败";
        $("loginMsg").className = "msg err";
        return;
      }
      state.token = json.data.token;
      localStorage.setItem("gt_token", state.token);
      $("loginMsg").textContent = "登录成功";
      $("loginMsg").className = "msg";
      await afterLogin();
    };

    $("importBtn").onclick = async () => {
      let rows;
      try {
        rows = JSON.parse($("importBox").value);
      } catch (e) {
        $("importMsg").textContent = "JSON 解析失败";
        $("importMsg").className = "msg err";
        return;
      }
      const json = await api("/api/admin/import", {
        method: "POST",
        body: JSON.stringify({ rows }),
      });
      $("importMsg").textContent = json.code === 0
        ? json.message + "\n" + (json.data.created || []).map(x => `第${x.row}行 → ${x.code}`).join("\n")
        : json.message;
      $("importMsg").className = json.code === 0 ? "msg" : "msg err";
      if (json.code === 0) await refresh();
    };

    $("refreshBtn").onclick = refresh;
    $("logoutBtn").onclick = () => {
      state.token = "";
      localStorage.removeItem("gt_token");
      $("mainPanel").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
    };

    if (state.token) afterLogin();
  </script>
</body>
</html>
