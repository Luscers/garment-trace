<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>溯源码演示</title>
  <style>
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3efe8;
      color: #1c1712;
      padding: 28px 16px 48px;
    }
    .wrap { width: min(880px, 100%); margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .sub { color: #8a7f72; margin: 0 0 24px; line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fffdf9;
      border: 1px solid #e7dfd3;
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(28,23,18,0.05);
    }
    .card img {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #eee6da;
    }
    .code {
      margin: 12px 0 6px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
    }
    .name { color: #8a7f72; font-size: 13px; min-height: 40px; }
    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #9a6b3f;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
    }
    .tip {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #efe6d8;
      color: #5c5248;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>服装溯源码 · 演示入口</h1>
    <p class="sub">用手机「扫一扫」下方二维码，或点击卡片查看溯源页。也可访问 <code>/admin</code> 查看工厂后台。</p>
    <div class="grid" id="grid">加载中…</div>
    <div class="tip">
      <strong>演示说明</strong><br/>
      1. 吊牌二维码指向 <code>/t/{溯源码}</code>，消费者扫码即见厂家、地址、批次等信息。<br/>
      2. 工厂侧在 <code>/admin</code> 导入款号批次即可自动生码、导出。<br/>
      3. 本 Demo 使用 SQLite 便于演示，正式环境按规格切换 MySQL。
    </div>
  </div>
  <script>
    async function main() {
      const res = await fetch("/api/demo/codes");
      const json = await res.json();
      const codes = json.data || [];
      const names = {
        "GT-A01-8F3K2M": "精纺羊毛大衣 · 燕麦色",
        "GT-A02-5R9W1P": "真丝印花连衣裙 · 墨绿提花",
        "GT-B01-7N4Q6X": "精梳棉衬衫 · 雾蓝",
      };
      document.getElementById("grid").innerHTML = codes.map(c => `
        <div class="card">
          <img src="/static/qr/${c}.png" alt="${c}" />
          <div class="code">${c}</div>
          <div class="name">${names[c] || "溯源演示样衣"}</div>
          <a class="btn" href="/t/${c}" target="_blank">查看溯源页</a>
        </div>
      `).join("");
    }
    main();
  </script>
</body>
</html>
