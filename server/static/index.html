<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>产品溯源</title>
  <style>
    /* Mature product-passport UI: clean white, tight type, label-style tables.
       References: fashion DPP microsites (Rudholm/EON), Chinese quality labels,
       Tabler/Element enterprise density — no gradients, glows, or decorative seals. */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2329;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }

    .shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      border-left: 1px solid #e5e6eb;
      border-right: 1px solid #e5e6eb;
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #e5e6eb;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar .brand {
      font-size: 13px;
      color: #1f2329;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .topbar .brand span {
      color: #86909c;
      font-weight: 400;
      margin-left: 6px;
    }

    .topbar .status {
      font-size: 12px;
      color: #00b42a;
      background: #e8ffea;
      border: 1px solid #aff0b5;
      border-radius: 2px;
      padding: 2px 8px;
    }

    .product-head {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid #e5e6eb;
    }

    .product-visual {
      width: 96px;
      height: 96px;
      border: 1px solid #e5e6eb;
      border-radius: 2px;
      background: #f7f8fa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .product-visual svg { width: 56px; height: 56px; }

    .product-title {
      flex: 1;
      min-width: 0;
    }

    .product-title h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: #86909c;
      font-size: 12px;
    }

    .meta-row b {
      color: #4e5969;
      font-weight: 500;
    }

    .code-line {
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #1f2329;
      background: #f2f3f5;
      border: 1px solid #e5e6eb;
      border-radius: 2px;
      padding: 6px 8px;
      word-break: break-all;
    }

    .section {
      padding: 14px 16px 4px;
    }

    .section + .section {
      border-top: 8px solid #f5f6f8;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2329;
    }

    .section-title::before {
      content: "";
      width: 3px;
      height: 14px;
      background: #165dff;
      border-radius: 1px;
    }

    .desc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .desc-table th,
    .desc-table td {
      padding: 8px 0;
      border-bottom: 1px solid #f2f3f5;
      vertical-align: top;
      font-size: 13px;
    }

    .desc-table th {
      width: 88px;
      text-align: left;
      color: #86909c;
      font-weight: 400;
    }

    .desc-table td {
      color: #1f2329;
      word-break: break-word;
    }

    .desc-table tr:last-child th,
    .desc-table tr:last-child td {
      border-bottom: 0;
    }

    .steps {
      margin: 0 0 12px;
      padding: 0;
      list-style: none;
    }

    .steps li {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f2f3f5;
    }

    .steps li:last-child { border-bottom: 0; }

    .steps .t {
      color: #86909c;
      font-size: 12px;
    }

    .steps .n {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .steps .d {
      color: #4e5969;
      font-size: 12px;
    }

    .notice {
      margin: 8px 0 16px;
      padding: 10px 12px;
      background: #f7f8fa;
      border: 1px solid #e5e6eb;
      border-radius: 2px;
      color: #4e5969;
      font-size: 12px;
      line-height: 1.7;
    }

    .footer {
      padding: 16px;
      border-top: 1px solid #e5e6eb;
      color: #86909c;
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
    }

    .loading, .error {
      max-width: 480px;
      margin: 0 auto;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #86909c;
      background: #fff;
    }

    .error h1 {
      margin: 0;
      font-size: 18px;
      color: #1f2329;
    }

    .error p {
      margin: 0;
      font-size: 13px;
    }

    .badge-soft {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 2px;
      background: #f2f3f5;
      color: #4e5969;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app" class="loading">正在查询溯源信息…</div>

  <script>
    function codeFromPath() {
      const path = location.pathname.replace(/\/+$/, "");
      const parts = path.split("/").filter(Boolean);
      if (parts[0] === "t" && parts[1]) return decodeURIComponent(parts[1]).toUpperCase();
      return (new URLSearchParams(location.search).get("code") || "").toUpperCase();
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function fmtDate(d) {
      return d ? String(d).replaceAll("-", ".") : "—";
    }

    function row(k, v) {
      return `<tr><th>${esc(k)}</th><td>${esc(v || "—")}</td></tr>`;
    }

    async function main() {
      const app = document.getElementById("app");
      const code = codeFromPath();
      if (!code) {
        app.className = "error";
        app.innerHTML = "<h1>无法查询</h1><p>请扫描吊牌或洗水唛上的溯源二维码</p>";
        return;
      }

      try {
        const res = await fetch(`/api/trace/${encodeURIComponent(code)}`);
        const json = await res.json();
        if (json.code !== 0 || !json.data) {
          app.className = "error";
          app.innerHTML = `<h1>未查询到溯源信息</h1><p>${esc(json.message || "请核对二维码是否完整，或联系厂家客服")}</p>`;
          return;
        }

        const d = json.data;
        const f = d.factory || {};
        const p = d.product || {};
        const b = d.batch || {};
        const timeline = d.timeline || [];

        app.className = "shell";
        app.innerHTML = `
          <header class="topbar">
            <div class="brand">${esc(f.brand || "品牌溯源")}<span>产品档案</span></div>
            <div class="status">已核验</div>
          </header>

          <div class="product-head">
            <div class="product-visual" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="14" width="44" height="40" stroke="#c9cdd4" stroke-width="2"/>
                <path d="M22 14c0-4 4.5-8 10-8s10 4 10 8" stroke="#c9cdd4" stroke-width="2"/>
                <path d="M22 28h20M22 36h14" stroke="#c9cdd4" stroke-width="2"/>
              </svg>
            </div>
            <div class="product-title">
              <h1>${esc(p.name || "服装产品")}</h1>
              <div class="meta-row">
                <span><b>款号</b> ${esc(p.style_no)}</span>
                <span><b>批次</b> ${esc(b.batch_no)}</span>
                <span class="badge-soft">${esc(b.grade || "合格")}</span>
              </div>
              <div class="meta-row" style="margin-top:6px">
                <span><b>颜色</b> ${esc(p.color || "—")}</span>
                <span><b>尺码</b> ${esc(p.size_range || "—")}</span>
              </div>
              <div class="code-line">溯源码 ${esc(d.code)}</div>
            </div>
          </div>

          <section class="section">
            <h2 class="section-title">产品信息</h2>
            <table class="desc-table">
              ${row("品名", p.name)}
              ${row("类别", p.category)}
              ${row("主要成分", p.composition)}
              ${row("执行标准", p.standard_no)}
              ${row("洗涤保养", p.care)}
            </table>
          </section>

          <section class="section">
            <h2 class="section-title">生产信息</h2>
            <table class="desc-table">
              ${row("生产厂家", f.name)}
              ${row("生产地址", f.address)}
              ${row("生产日期", fmtDate(b.production_date))}
              ${row("生产车间", b.workshop)}
              ${row("检验员", b.inspector)}
              ${row("质量等级", b.grade)}
              ${row("营业执照", f.license_no)}
            </table>
          </section>

          <section class="section">
            <h2 class="section-title">生产履历</h2>
            <ul class="steps">
              ${timeline.map(t => `
                <li>
                  <div class="t">${esc(t.time)}</div>
                  <div>
                    <div class="n">${esc(t.step)}</div>
                    <div class="d">${esc(t.note)}</div>
                  </div>
                </li>
              `).join("")}
            </ul>
          </section>

          <section class="section">
            <h2 class="section-title">厂家信息</h2>
            <table class="desc-table">
              ${row("企业名称", f.name)}
              ${row("品牌", f.brand)}
              ${row("联系部门", f.contact)}
              ${row("联系电话", f.phone)}
              ${row("企业简介", f.intro)}
            </table>
            <div class="notice">
              以上信息由生产厂家在溯源系统登记并对内容真实性负责。如有疑问请保留吊牌，联系厂家核实。
            </div>
          </section>

          <footer class="footer">
            ${esc(f.name)}<br/>
            质量追溯平台 · 仅供购买渠道与质量查询
          </footer>
        `;
      } catch (e) {
        app.className = "error";
        app.innerHTML = "<h1>加载失败</h1><p>网络异常，请稍后重试</p>";
      }
    }

    main();
  </script>
</body>
</html>
